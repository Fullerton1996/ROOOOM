<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Read the Room</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    #start-btn {
      background: none;
      border: 1px solid #333;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      padding: 1rem 2.4rem;
      cursor: pointer;
      border-radius: 2px;
      transition: border-color 0.3s, color 0.3s;
    }

    #start-btn:hover {
      border-color: #666;
      color: #fff;
    }

    #main-ui {
      display: none;
      text-align: center;
      user-select: none;
    }

    #mood-label {
      font-size: clamp(2rem, 6vw, 5rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      color: #ffffff;
      transition: opacity 1.2s ease;
    }

    #mood-label.transitioning {
      opacity: 0.15;
    }

    #pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      margin: 2rem auto 0;
      animation: pulse 2.4s ease-in-out infinite;
    }

    #pulse.inactive {
      background: #555;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50%       { transform: scale(1.8); opacity: 0.4; }
    }

    #vector-debug {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      color: #444;
      font-family: "SF Mono", "Fira Code", monospace;
      white-space: nowrap;
    }

    #end-btn {
      position: fixed;
      bottom: 1.4rem;
      right: 1.4rem;
      background: none;
      border: 1px solid #2a2a2a;
      color: #555;
      font-family: inherit;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      border-radius: 2px;
      transition: border-color 0.2s, color 0.2s;
    }

    #end-btn:hover {
      border-color: #555;
      color: #999;
    }

    #connection-dot {
      position: fixed;
      top: 1.2rem;
      right: 1.2rem;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #555;
    }

    #connection-dot.connected {
      background: #4ade80;
    }
  </style>
</head>
<body>

  <button id="start-btn">start session</button>

  <div id="main-ui">
    <div id="mood-label">—</div>
    <div id="pulse" class="inactive"></div>
  </div>

  <div id="vector-debug">energy 0.00  ·  warmth 0.00  ·  density 0.00  ·  laughter 0.00</div>
  <button id="end-btn">End Session</button>
  <div id="connection-dot"></div>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script src="/audio.js"></script>
  <script src="/mood.js"></script>
  <script src="/app.js"></script>
</body>
</html>
